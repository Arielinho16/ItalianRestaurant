{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h2>Agregar Nuevo Elemento al Menú</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary mt-3">Guardar</button>
        <a href="{% url 'menu_list' %}" class="btn btn-secondary mt-3">Cancelar</a>
    </form>
</form>
</div>
{% endblock %}
