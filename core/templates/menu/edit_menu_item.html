{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h2>Editar Item: {{ item.name }}</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary mt-3">Guardar Cambios</button>
        <a href="{% url 'menu_detail' item.id %}" class="btn btn-secondary mt-3">Cancelar</a>
    </form>
</div>
{% endblock %}
